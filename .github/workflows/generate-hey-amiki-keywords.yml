name: Generate Amiki wake-word tokens

on:
  push:
    branches:
      - feat/amiki-owned-hey-amiki-ci-validation
  pull_request:
    branches:
      - fix/assistant-and-afdi-crash-guards-ci
    types: [opened, synchronize, reopened]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  tokenize:
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install pinned SentencePiece tokenizer
        run: python -m pip install --disable-pip-version-check sentencepiece==0.2.1

      - name: Download and verify exact model tokenizer assets
        shell: bash
        run: |
          set -euo pipefail
          base="https://huggingface.co/mobilebytesensei/sherpa-onnx-kws-zipformer-gigaspeech-3.3M/resolve/main"
          curl --fail --location --retry 3 --retry-delay 2 "$base/tokens.txt?download=true" -o tokens.txt
          curl --fail --location --retry 3 --retry-delay 2 "$base/bpe.model?download=true" -o bpe.model
          echo "fd2ded4050a55d2b1578870ba8697d02371980217806b7558bd0a5cc60f3ba53  tokens.txt" | sha256sum --check -
          echo "c8a2a0129c4ab8e463164c142f82d25649661b122c8cd0b7aab5c9e80b90ad24  bpe.model" | sha256sum --check -

      - name: Generate exact Hey Amiki BPE keyword list
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p generated
          python - <<'PY'
          from pathlib import Path
          import sentencepiece as spm

          tokens = {}
          for line in Path("tokens.txt").read_text(encoding="utf-8").splitlines():
              parts = line.split()
              if len(parts) == 2:
                  tokens[parts[0]] = int(parts[1])

          processor = spm.SentencePieceProcessor(model_file="bpe.model")
          pieces = processor.encode("HEY AMIKI", out_type=str)
          if not pieces:
              raise SystemExit("SentencePiece returned no tokens for HEY AMIKI")
          missing = [piece for piece in pieces if piece not in tokens]
          if missing:
              raise SystemExit(f"Model token table is missing SentencePiece pieces: {missing}")

          keyword_line = " ".join(pieces) + " @hey_amiki"
          output = Path("generated/keywords.txt")
          output.write_text(keyword_line + "\n", encoding="utf-8")
          print("Verified keyword phrase: HEY AMIKI")
          print("BPE pieces:", " | ".join(pieces))
          print("Keyword file:", keyword_line)
          print("Token IDs:", [tokens[piece] for piece in pieces])
          PY

      - name: Upload generated keyword file
        uses: actions/upload-artifact@v4
        with:
          name: amiki-hey-amiki-keywords
          path: generated/keywords.txt
          if-no-files-found: error
          retention-days: 30
